<style>
*{box-sizing:border-box;}
:root{--paper:oklch(.965 .005 95);--ink:oklch(.3 .14 265);--accent:oklch(.72 .19 60);
--card:oklch(.99 .005 95);--danger:oklch(.56 .2 25);--muted:oklch(.92 .02 260);}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;
background:var(--ink);color:var(--paper);padding:12px 20px;border-bottom:3px solid var(--accent);}
.topnav .brand{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:22px;
color:var(--paper);text-decoration:none;display:flex;align-items:center;gap:9px;letter-spacing:.5px;}
.topnav .brand img{height:26px;width:26px;}
.topnav .brand b{color:var(--accent);font-weight:900;}
.topnav .tastelinks{display:flex;gap:16px;align-items:center;}
.topnav .tastelink{color:var(--paper);text-decoration:none;font-size:13px;font-weight:700;
letter-spacing:1.5px;text-transform:uppercase;}
.topnav .tastelink:hover{color:var(--accent);}
.topnav .citylinks{display:flex;gap:6px;margin-left:auto;}
.topnav .citylinks a{color:var(--paper);text-decoration:none;font-size:13px;font-weight:700;
padding:7px 14px;border:2px solid transparent;text-transform:uppercase;letter-spacing:1px;}
.topnav .citylinks a:hover{border-color:var(--accent);color:var(--accent);}
.bhero{background:var(--accent);color:var(--on-accent);padding:56px 24px 44px;text-align:center;
border-bottom:3px solid var(--ink);}
.bhero .eyebrow{display:inline-block;background:var(--ink);color:var(--paper);
font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;padding:7px 14px;}
.bhero h1{font-family:'Fraunces',Georgia,serif;font-weight:900;
font-size:clamp(2.6rem,8vw,4.5rem);line-height:1.02;margin:20px 0 12px;letter-spacing:.5px;}
.bhero p{font-size:15.5px;margin:0 auto;max-width:560px;line-height:1.6;font-weight:500;}
.steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;flex-wrap:wrap;}
.step{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
padding:9px 16px;border:2px solid var(--ink);background:var(--paper);}
.step b{margin-right:6px;}
.step.on{background:var(--ink);color:var(--paper);}
.sarr{font-weight:900;font-size:14px;}
.sform{max-width:680px;margin:0 auto;padding:34px 20px 64px;}
.tsec{background:var(--card);border:3px solid var(--ink);
box-shadow:6px 6px 0 var(--ink);margin:0 0 28px;}
.shead{background:var(--accent);border-bottom:3px solid var(--ink);
display:flex;align-items:center;gap:14px;padding:12px 20px;color:var(--on-accent);}
.snum{flex:none;width:34px;height:34px;background:var(--ink);color:var(--paper);
font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:18px;
display:flex;align-items:center;justify-content:center;}
.shead h2{font-size:16px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;margin:0;}
.tsec-body{padding:20px 22px 14px;}
.thint{font-size:13.5px;color:var(--ink);opacity:.72;line-height:1.55;margin:4px 0 10px;font-weight:500;}
.sfield{margin:14px 0;}
.sfield label{display:block;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;
font-weight:800;margin-bottom:8px;}
.sfield input[type=email],.sfield input[type=tel],.sfield select{width:100%;max-width:100%;
padding:13px 16px;border:3px solid var(--ink);font-size:16px;
font-family:inherit;color:var(--ink);background:var(--field);}
.sfield select{appearance:none;-webkit-appearance:none;padding-right:42px;cursor:pointer;
background:var(--field) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="9"><path d="M1 1l6 6 6-6" stroke="%231a2b5c" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>') no-repeat right 16px center;}
.sfield input:focus,.sfield select:focus{outline:3px solid var(--accent);outline-offset:1px;}
.loadrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0 8px;}
.btn2{padding:11px 22px;border:3px solid var(--ink);background:var(--paper);
font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
color:var(--ink);cursor:pointer;font-family:inherit;flex:none;box-shadow:4px 4px 0 var(--ink);}
.btn2:hover{background:var(--accent);color:var(--on-accent);}
.btn2:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;
padding:11px 0;border-bottom:2px solid var(--muted);}
.trow:last-child{border-bottom:none;}
.tcat{font-size:16px;font-weight:700;display:flex;align-items:center;min-width:0;}
.cico{flex:none;width:34px;height:34px;background:var(--accent);border:2px solid var(--ink);
display:inline-flex;align-items:center;justify-content:center;margin-right:12px;color:var(--on-accent);}
.cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.seg{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;}
.seg button{padding:8px 13px;border:2px solid var(--ink);background:var(--paper);
font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;
font-family:inherit;color:var(--ink);display:inline-flex;align-items:center;gap:6px;}
.seg button:hover{background:var(--muted);}
.seg button.on{background:var(--ink);color:var(--paper);}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;
padding:15px 0;border-bottom:2px solid var(--muted);}
.srow:last-child{border-bottom:none;}
.srow .tcat{font-size:16px;font-weight:700;display:flex;align-items:center;min-width:0;}
.ric{flex:none;width:36px;height:36px;background:var(--accent);border:2px solid var(--ink);
display:inline-flex;align-items:center;justify-content:center;margin-right:12px;color:var(--on-accent);}
.ttxt{min-width:0;flex:1;}
.srow .sub{font-size:13px;color:var(--ink);opacity:.72;display:block;margin-top:4px;
font-weight:500;line-height:1.5;}
.srow .sub a{color:var(--ink);font-weight:700;text-decoration:underline;
text-decoration-color:var(--accent);text-decoration-thickness:2px;}
.switch{position:relative;width:58px;height:32px;flex:none;cursor:pointer;}
.switch input{opacity:0;width:0;height:0;}
.sl{position:absolute;inset:0;background:var(--muted);border:3px solid var(--ink);transition:.15s;}
.sl:before{content:"";position:absolute;height:18px;width:18px;left:4px;top:4px;
background:var(--paper);border:3px solid var(--ink);transition:.15s;}
.switch input:checked + .sl{background:var(--accent);color:var(--on-accent);}
.switch input:checked + .sl:before{transform:translateX(24px);background:var(--ink);}
.eprev{margin:18px 0 10px;border:3px solid var(--ink);background:var(--field);box-shadow:6px 6px 0 var(--ink);}
.eprev-bar{display:flex;align-items:center;gap:7px;padding:11px 14px;background:var(--ink);
color:var(--paper);}
.edot{width:10px;height:10px;background:var(--paper);opacity:.5;}
.eprev-title{margin-left:8px;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.eprev-sub{font-size:11.5px;opacity:.7;font-weight:500;text-transform:none;letter-spacing:0;}
.eprev-row{display:flex;align-items:center;gap:10px;padding:11px 14px;

.eprev-row:last-of-type{border-bottom:none;}
.etag{flex:none;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;

.etag.free{background:var(--accent);color:var(--on-accent);}

.etime{font-weight:700;font-size:12.5px;flex:none;}
.eprev-foot{padding:10px 14px;font-size:12.5px;font-weight:600;background:var(--muted);text-align:center;}
.eplabel{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;margin:20px 0 10px;}
.btn-gold{display:inline-block;padding:16px 48px;border:3px solid var(--ink);

text-transform:uppercase;cursor:pointer;font-family:inherit;
box-shadow:6px 6px 0 var(--ink);}
.btn-gold:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--ink);}
.btn-gold:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink);}
.btn-gold:disabled{opacity:.6;cursor:wait;transform:none;}
.tcenter{text-align:center;}
.reassure{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:16px;
font-size:12.5px;font-weight:600;}
.reassure span:before{content:"\2713  ";font-weight:800;}

font-weight:600;text-align:center;}
#formMsg.ok{color:#1d6b3a;} #formMsg.err{color:var(--danger);}
.sdone{max-width:640px;margin:0 auto;padding:40px 20px 64px;text-align:center;display:none;
border:3px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--ink);}
.sdone h2{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:34px;margin:0 0 8px;}
.sdone h2 em{font-style:normal;background:var(--accent);padding:0 8px;color:var(--on-accent);}
.sdone p{line-height:1.65;max-width:480px;margin:12px auto;font-weight:500;}
.sdone a{color:var(--ink);font-weight:800;text-decoration:underline;
text-decoration-color:var(--accent);text-decoration-thickness:2px;}
footer{background:var(--ink);color:var(--paper);text-align:center;
padding:36px 24px;font-size:13px;border-top:3px solid var(--accent);margin-top:20px;}
footer .serif{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:18px;margin-bottom:8px;}
footer p{opacity:.85;line-height:1.7;margin:6px 0;font-weight:500;}
footer a{color:var(--accent);font-weight:700;}
@media(max-width:520px){
.bhero{padding:40px 18px 32px;}
.sform{padding:26px 14px 48px;}
.tsec-body{padding:16px 16px 10px;}

.seg button{padding:7px 10px;font-size:11.5px;}

<body><main class="fr-wrap">
<h1 id="frHead">Loading your invite…</h1>
<p id="frMsg"></p>
<a class="fr-btn" id="frSign" href="./account.html?next=friend.html" hidden>Sign in to accept →</a>
<button type="button" class="fr-btn" id="frAccept" hidden>Accept</button>
<p><a class="fr-btn" id="frGo" href="./" hidden>See what's on tonight →</a></p>
</main>
<script>
(function(){
function $(id){ return document.getElementById(id); }
var code = new URLSearchParams(location.search).get("c");
try { if (code) localStorage.setItem("tonight-friend-code", code); else code = localStorage.getItem("tonight-friend-code"); } catch (e) {}
function api(path, opts){ opts = opts || {}; opts.headers = window.TonightAuth ? TonightAuth.headers(opts.headers || {}) : (opts.headers || {});
  return fetch((window.__tonight_api || "") + path, opts).then(function(r){ return r.json(); }); }
function say(t){ $("frMsg").textContent = t; }
function done(){ try { localStorage.removeItem("tonight-friend-code"); } catch (e) {} }
function start(){
  if (!code) { $("frHead").textContent = "No invite here"; say("Open the link a friend sent you."); return; }
  api("/friends/invite/" + encodeURIComponent(code)).then(function(d){
    if (!d.ok) { $("frHead").textContent = "This link didn't work"; say(d.error || ""); done(); return; }
    $("frHead").textContent = d.from + " invited you to be friends on Tonight";
    var signed = window.TonightAuth && TonightAuth.token();
    $("frSign").hidden = !!signed; $("frAccept").hidden = !signed;
  }).catch(function(){ say("Couldn't reach Tonight. Try again in a bit."); });
}
$("frAccept").addEventListener("click", function(){
  api("/friends/accept", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({code: code})}).then(function(d){
    if (!d.ok) { say(d.error || "That didn't work."); return; }
    done(); $("frAccept").hidden = true;
    $("frHead").textContent = "You and " + d.friend + " are friends";
    say("You'll see when " + d.friend + " is going to something, and they'll see yours (change who sees it in Account).");
