<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>The test — Lineup</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff7ec;--ink:#151515;--soft:#5f574c;--hot:#ff4f2e;--sun:#ffc21a;--ok:#13996f;--no:#b8321b;}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 'Space Grotesk',system-ui,sans-serif;padding:28px 16px 60px;}
.w{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
h1{font:400 clamp(36px,7vw,56px)/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:0;}
.k{font-weight:700;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--hot);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:12px;}
input{border:2px solid var(--ink);border-radius:999px;padding:8px 12px;font:inherit;background:#fff;}
button{border:2px solid var(--ink);border-radius:999px;padding:9px 16px;font:700 14px inherit;background:var(--sun);cursor:pointer;box-shadow:0 2px 0 var(--ink);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.n{border:2px solid var(--ink);border-radius:18px;background:#fff;padding:14px 16px;box-shadow:0 2px 0 var(--ink);}
.n b{display:block;font:400 44px/1 Anton,Impact,sans-serif;} .n span{display:block;font-weight:600;margin-top:4px;}
.n em{font-style:normal;font-weight:700;font-size:13px;} .ok{color:var(--ok);} .no{color:var(--no);} .wait{color:var(--soft);}
.n input{width:70px;padding:3px 8px;font-size:13px;}
table{border-collapse:collapse;width:100%;background:#fff;border:2px solid var(--ink);border-radius:14px;overflow:hidden;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e8dac6;font-size:14px;} th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);}
.tw{overflow-x:auto;} .msg{color:var(--soft);}
</style></head><body><div class="w">
<div class="k">Lineup · the 20-person test</div><h1>Is it working?</h1>
<p class="msg">Give each person a link like <b>lineup.city/?ref=maya</b> (letters, numbers, dashes). Everything here is anonymous counts per device; no names or emails.</p>
<div class="row"><label>Admin key<input id="key" type="password" autocomplete="off"></label><label>Test started<input id="start" type="date"></label><button id="go">Show the numbers</button></div>
<p class="msg" id="msg"></p><div class="grid" id="nums"></div><div class="tw" id="ppl"></div></div>
<script>
(function(){
var API = "https://tonight-api-2169.onrender.com/api", $ = function(i){ return document.getElementById(i); };
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
$("key").value = ls("tonight-admin-key") || ""; $("start").value = ls("tonight-test-start") || new Date().toISOString().slice(0,10);
var G = {}; try { G = JSON.parse(ls("tonight-test-goals") || "{}"); } catch(e){}
var DEF = {planned_week1:10, friends_reached:20, answers_per_invite:2, back_week3:7};
var LBL = {planned_week1:["planned a night in week 1", 1], friends_reached:["friends reached by invites", 1], answers_per_invite:["answers per invite", 1], back_week3:["came back in week 3", 3]};
function card(k, d){
  var goal = +(G[k] != null ? G[k] : DEF[k]), v = d[k], due = d.week >= LBL[k][1];
  var st = !due ? '<em class="wait">counts from week ' + LBL[k][1] + '</em>' : v >= goal ? '<em class="ok">goal ' + goal + ' ✓</em>' : '<em class="no">goal ' + goal + ' ✗</em>';
  return '<div class="n"><b>' + v + '</b><span>' + LBL[k][0] + '</span>' + st + '<br><label style="margin-top:6px">Goal<input data-k="' + k + '" type="number" step="0.1" value="' + goal + '"></label></div>';
}
function show(d){
  $("msg").textContent = "Week " + d.week + " of 3 · " + d.invites + " invites made · " + d.active_week1 + " active in week 1.";
  $("nums").innerHTML = ["planned_week1","friends_reached","answers_per_invite","back_week3"].map(function(k){ return card(k, d); }).join("");
  $("nums").querySelectorAll("input").forEach(function(i){ i.onchange = function(){ G[i.getAttribute("data-k")] = +i.value; ls("tonight-test-goals", JSON.stringify(G)); show(d); }; });
  $("ppl").innerHTML = d.people.length ? '<table><thead><tr><th>Link</th><th>Visits</th><th>Lineups</th><th>Invites</th><th>Answers</th><th>Locked</th><th>Last seen</th></tr></thead><tbody>' +
    d.people.map(function(p){ return '<tr><td><b>' + p.ref + '</b></td><td>' + p.visit + '</td><td>' + p.make + '</td><td>' + p.invite + '</td><td>' + p.answer + '</td><td>' + p.lock + '</td><td>' + p.last + '</td></tr>'; }).join("") + '</tbody></table>'
    : '<p class="msg">Nobody has opened a test link yet.</p>';
}
$("go").onclick = function(){
  ls("tonight-admin-key", $("key").value.trim()); ls("tonight-test-start", $("start").value);
  $("msg").textContent = "Loading…";
  fetch(API + "/admin/test?start=" + $("start").value, {headers: {"X-Admin-Key": $("key").value.trim()}}).then(function(r){ return r.json(); })
    .then(function(d){ if (!d.ok) { $("msg").textContent = d.error || "That didn't work."; return; } show(d); })
    .catch(function(){ $("msg").textContent = "Couldn't reach Lineup."; });
};
if ($("key").value) $("go").click();
})();
</script><script>window.__tonight_api="https://tonight-api-2169.onrender.com/api"||null;(function(){try{if(/^https?:\/\/(localhost|127\.0\.0\.1)[:/]/.test(window.__tonight_api||""))return;fetch("https://lineup.city/api.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d&&d.api)window.__tonight_api=d.api;}).catch(function(){});}catch(e){}})();</script></body></html>
